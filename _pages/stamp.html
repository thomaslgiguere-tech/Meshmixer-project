<style>
.stamp-app { display:flex; flex-direction:column; gap:1rem; }
.stamp-top { height:50vh; }
.stamp-bottom { height:50vh; }
#stamp-input {
  width:100%; height:100%; box-sizing:border-box; padding:1rem;
  font: 1rem ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace;
  border:1px solid #ccc; border-radius:6px; resize:none; background:#fff; color:#000; caret-color:#000;
}
.output-box {
  background:#000; color:#fff; white-space:pre; padding:1rem; height:100%;
  border-radius:6px; overflow:auto; font: 1rem ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace;
}
.actions { display:flex; gap:.5rem; flex-wrap:wrap; }
.actions button { padding:.5rem .75rem; border:1px solid #ccc; border-radius:6px; background:#f7f7f7; cursor:pointer; }
</style>

<div class="stamp-app">
  <div class="stamp-top">
    <label for="stamp-input"><strong>Enter text to stamp (top half)</strong></label>
    <textarea id="stamp-input" placeholder="Type here..."></textarea>
  </div>

  <div class="stamp-bottom">
    <div class="actions">
      <button id="clear-btn" type="button">Clear</button>
      <button id="select-btn" type="button">Select output</button>
      <button id="copy-btn" type="button">Copy</button>
    </div>
    <div id="stamp-output" class="output-box" aria-label="Output"></div>
  </div>
</div>

<script defer src="{{ '/assets/js/stamp.js' | relative_url }}"></script>
