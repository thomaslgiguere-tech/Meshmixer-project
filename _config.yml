# Configuration du site OMFS In-House VSP (Jekyll sur GitHub Pages, sans thème externe)

title: "OMFS In-House VSP"
description: "OMFS Planner, un projet d'add-on Blender gratuit et open source pour la planification chirurgicale maxillo-faciale, avec tutoriels et fichiers STL."
author: "Thomas Lafontaine-Giguère, DMD"
lang: fr

# Adresse publique. Tant qu'il n'y a pas de domaine perso : GitHub Pages sous /Meshmixer-project.
# Avec un domaine perso : remettre un fichier CNAME, url: "https://ledomaine.com" et baseurl: "".
url: "https://thomaslgiguere-tech.github.io"
baseurl: "/Meshmixer-project"

# Liens utilisés dans les pages
site_repo: "https://github.com/thomaslgiguere-tech/Meshmixer-project"
planner_repo: "https://github.com/thomaslgiguere-tech/omfs-planner"
install_cmd: "curl -fsSL https://raw.githubusercontent.com/thomaslgiguere-tech/omfs-planner/main/tools/install_mac.sh | sh"

permalink: pretty
markdown: kramdown

include:
  - _pages

exclude:
  - CLAUDE.md
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .bundle
  - assets/media/README.md

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: default
